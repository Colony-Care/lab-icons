name: Publish

# Pushing a tag such as v0.4.0 stages that version on npm through trusted
# publishing (OIDC, no token stored). A maintainer then approves it with 2FA:
#   npm stage list @colony-care/lab-icons
#   npm stage approve <stage-id> --otp=<code>
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url: it writes an .npmrc with a placeholder token that npm
      # would send instead of the OIDC exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use npm 11 (staged publishing)
        run: npm install -g npm@11 && npm --version
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm stage publish
